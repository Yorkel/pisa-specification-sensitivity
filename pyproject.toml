[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pisa-specsens"
version = "1.0.0"
description = "Specification sensitivity analysis for PISA 2022 mathematics outcomes"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Louise Yorke" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.10",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]
figures = ["matplotlib>=3.7", "jupyter>=1.0"]

[project.scripts]
pisa-specsens = "pisa_specsens.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pisa_specsens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
